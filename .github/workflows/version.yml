name: Version app
on:
  workflow_dispatch:
    inputs:
      release:
        description: Version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Increment and tag
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          git config user.name "90+ release bot"
          git config user.email "actions@github.com"
          npm version "$RELEASE" -m "chore(release): v%s"
          git push --follow-tags
