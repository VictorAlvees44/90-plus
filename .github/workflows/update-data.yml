name: Update football data
on:
  schedule:
    - cron: '15 10 * * *'
    - cron: '15 15 * * *'
    - cron: '15 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run collect:data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      - name: Commit new snapshots
        run: |
          git config user.name "90+ data bot"
          git config user.email "actions@github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "chore(data): update football snapshots"
          git push
